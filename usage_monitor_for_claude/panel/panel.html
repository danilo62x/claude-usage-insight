<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
    <nav class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" data-tab="sessions" id="tabSessions"></button>
        <button type="button" role="tab" class="tab" data-tab="charts" id="tabCharts"></button>
        <button type="button" role="tab" class="tab" data-tab="insights" id="tabInsights"></button>
        <button type="button" role="tab" class="tab" data-tab="quotas" id="tabQuotas"></button>
    </nav>
    <div class="header-right">
        <span id="status" class="status"></span>
        <select id="range" aria-label="range"></select>
        <button type="button" id="themeBtn" class="ghost icon" title="theme">&#9681;</button>
        <button type="button" id="refreshBtn" class="ghost"></button>
    </div>
</header>

<div class="body">
    <main>
        <section id="panelSessions" class="panel">
            <div class="table-wrap">
                <table id="sessionsTable">
                    <thead>
                        <tr>
                            <th data-sort="weighted" class="num sorted" id="thWeighted"></th>
                            <th data-sort="raw" class="num" id="thRaw"></th>
                            <th data-sort="turns" class="num" id="thTurns"></th>
                            <th data-sort="ctx_avg" class="num" id="thCtxAvg"></th>
                            <th data-sort="ctx_peak" class="num" id="thCtxPeak"></th>
                            <th data-sort="sub_weighted" class="num" id="thSub"></th>
                            <th data-sort="first_ts" id="thWhen"></th>
                            <th data-sort="project" id="thProject"></th>
                            <th id="thTopic"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p class="empty" id="sessionsEmpty" hidden></p>
            </div>
        </section>

        <section id="panelCharts" class="panel" hidden>
            <p class="hint" id="hintDrag"></p>
            <div class="grid" id="chartGrid">
                <figure class="card wide" draggable="true" data-chart="daily">
                    <figcaption><span class="grip">&#8942;&#8942;</span><span id="capDaily"></span></figcaption>
                    <div class="canvas-box"><canvas id="chartDaily"></canvas></div>
                </figure>
                <figure class="card" draggable="true" data-chart="hourly">
                    <figcaption><span class="grip">&#8942;&#8942;</span><span id="capHourly"></span></figcaption>
                    <div class="canvas-box"><canvas id="chartHourly"></canvas></div>
                </figure>
                <figure class="card" draggable="true" data-chart="project">
                    <figcaption><span class="grip">&#8942;&#8942;</span><span id="capProject"></span></figcaption>
                    <div class="canvas-box"><canvas id="chartProject"></canvas></div>
                </figure>
                <figure class="card wide" draggable="true" data-chart="curve">
                    <figcaption>
                        <span class="grip">&#8942;&#8942;</span><span id="capCurve"></span>
                        <select id="curveSession" class="inline-select"></select>
                    </figcaption>
                    <div class="canvas-box"><canvas id="chartCurve"></canvas></div>
                    <p class="hint" id="hintCurve"></p>
                </figure>
            </div>
        </section>

        <section id="panelInsights" class="panel" hidden>
            <p class="hint" id="hintInsights"></p>
            <div id="insightTraits"></div>
            <div class="grid" id="insightTables"></div>
        </section>

        <section id="panelQuotas" class="panel" hidden>
            <div id="quotaList"></div>
            <p class="hint" id="hintQuota"></p>
        </section>
    </main>

    <aside id="usageBar">
        <h2 id="usageHeading"></h2>
        <div id="usageList"></div>
        <div id="versionList" class="versions"></div>
    </aside>
</div>

<footer>
    <span id="footVersion" class="dim"></span>
    <span id="footWeights" class="dim"></span>
</footer>

<script src="vendor/chart.umd.min.js"></script>
<script src="panel.js"></script>
</body>
</html>
